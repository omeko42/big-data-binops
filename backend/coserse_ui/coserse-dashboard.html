<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coserse 1.0 — Big Data Binops CAS Bareskrim Polri</title>
  <style>
    :root {
      --cas-nav-bg: #0f172a;
      --bg-page: #f8fafc;
      --bg-surface: #ffffff;
      --bg-chat-sidebar: #f8fafc;
      --border: #e2e8f0;
      --border-soft: #eef2f6;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --danger: #dc2626;
      --ok: #059669;
      --warn: #d97706;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Outer CAS Web Shell (Profil pengguna tetap di header utama BDB, bukan di chat) */
    .cas-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      height: 100vh;
    }
    .cas-sidebar {
      background: var(--cas-nav-bg);
      color: #cbd5e1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .cas-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px 14px;
      border-bottom: 1px solid #1e293b;
      font-weight: 700;
      font-size: 13px;
      color: #f8fafc;
      letter-spacing: .04em;
    }
    .cas-brand-badge {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 12px;
      flex-shrink: 0;
    }
    .cas-nav-group {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #64748b;
      padding: 6px 10px 4px;
      font-weight: 700;
    }
    .cas-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 11px;
      border-radius: 8px;
      font-size: 13px;
      color: #cbd5e1;
      text-decoration: none;
      margin-bottom: 2px;
      transition: background .15s ease, color .15s ease;
    }
    .cas-nav-item:hover { background: #1e293b; color: #fff; }
    .cas-nav-item.active {
      background: linear-gradient(90deg, #dc2626, #b91c1c);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(220,38,38,.28);
    }
    .cas-nav-pill {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      color: #fff;
      font-weight: 700;
    }

    .cas-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      height: 100vh;
    }
    .cas-crumbbar {
      height: 52px;
      flex-shrink: 0;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }
    .cas-crumb {
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cas-crumb strong { color: var(--text-main); }
    .cas-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .cas-sandbox-tag {
      font-size: 11px;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }
    .cas-header-user {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 12px;
      color: #1e293b;
      font-weight: 600;
    }
    .cas-header-avatar {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #1d4ed8;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }
    .cas-header-role {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .cas-content {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 0;
      background: #ffffff;
    }
    #coserse-root {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
    }

    /* =====================================================================
       Coserse 1.0 Modern AI UI (Aligned with 01_empty_state & 04_usage_menu)
       ===================================================================== */
    .cs-app {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      background: #ffffff;
      position: relative;
    }
    .cs-drawer-backdrop {
      display: none;
    }

    /* Left History Sidebar (240px desktop, drawer overlay on tablet/mobile) */
    .cs-history-sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--bg-chat-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      transition: width .18s ease, transform .2s ease, opacity .18s ease;
    }
    .cs-history-sidebar.collapsed {
      width: 0;
      overflow: hidden;
      border-right: none;
      opacity: 0;
    }
    .cs-sidebar-top {
      padding: 14px 12px 8px;
    }
    .cs-new-chat-btn {
      width: 100%;
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(15,23,42,.03);
      transition: background .15s ease, border-color .15s ease;
    }
    .cs-new-chat-btn:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }
    .cs-sidebar-label {
      padding: 8px 14px 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #94a3b8;
    }
    .cs-session-list {
      flex: 1;
      overflow-y: auto;
      padding: 2px 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cs-session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 7px 8px 7px 10px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 12.5px;
      color: #334155;
      transition: background .12s ease, color .12s ease;
    }
    .cs-session-item:hover { background: #e2e8f0; }
    .cs-session-item.active {
      background: #e2e8f0;
      color: #0f172a;
      font-weight: 600;
    }
    .cs-session-title {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cs-session-actions {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity .12s ease;
    }
    .cs-session-item:hover .cs-session-actions,
    .cs-session-item.active .cs-session-actions,
    .cs-session-item.pinned .cs-session-actions,
    .cs-session-item.menu-open .cs-session-actions {
      opacity: 1;
    }
    .cs-sess-act-btn {
      border: none;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      width: 24px;
      height: 24px;
      padding: 0;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color .12s ease, background .12s ease;
    }
    .cs-sess-act-btn:hover { background: rgba(15, 23, 42, .08); color: #0f172a; }
    .cs-sess-act-btn.pinned { color: #2563eb; }
    .cs-rename-input {
      flex: 1;
      min-width: 0;
      border: 1px solid #2563eb;
      background: #ffffff;
      color: #0f172a;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12.5px;
      font-family: inherit;
      outline: none;
    }
    .cs-archive-toggle {
      width: 100%;
      border: none;
      background: transparent;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 10px 8px 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cs-archive-toggle:hover { color: #0f172a; }
    .cs-sess-menu {
      position: fixed;
      z-index: 120;
      width: 196px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, .16);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cs-sess-menu-item {
      width: 100%;
      border: none;
      background: transparent;
      color: #1e293b;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: left;
      transition: background .12s ease, color .12s ease;
    }
    .cs-sess-menu-item:hover { background: #f1f5f9; color: #0f172a; }
    .cs-sess-menu-item.danger { color: #dc2626; }
    .cs-sess-menu-item.danger:hover { background: #fef2f2; color: #b91c1c; }
    .cs-confirm-modal {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 48px rgba(15, 23, 42, .25);
      padding: 20px 22px 18px;
    }
    .cs-confirm-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .cs-confirm-ico {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #fef2f2;
      color: #dc2626;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .cs-confirm-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 4px;
    }
    .cs-confirm-msg {
      font-size: 13px;
      line-height: 1.5;
      color: #475569;
      margin: 0;
    }
    .cs-confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }
    .cs-sidebar-bottom {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
    }
    .cs-settings-btn {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: #475569;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: background .12s ease, color .12s ease;
    }
    .cs-settings-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* Center Workspace */
    .cs-workspace {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #ffffff;
    }
    .cs-drop-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, .80);
      color: #ffffff;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
      backdrop-filter: blur(2px);
    }
    .cs-drop-overlay.active { display: flex; }
    .cs-drop-box {
      border: 2px dashed #60a5fa;
      border-radius: 18px;
      padding: 32px 44px;
      text-align: center;
      background: rgba(15, 23, 42, .9);
      max-width: 420px;
    }
    .cs-drop-ico {
      margin-bottom: 10px;
      color: #93c5fd;
      display: flex;
      justify-content: center;
    }
    .cs-drop-sub { font-size: 12px; opacity: .82; margin-top: 6px; line-height: 1.45; }

    /* Minimal Clean Workspace Bar (NO colorful progress bar / noisy buttons) */
    .cs-ws-bar {
      height: 46px;
      flex-shrink: 0;
      padding: 0 18px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #ffffff;
    }
    .cs-ws-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .cs-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: #475569;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .cs-icon-btn:hover { background: #f1f5f9; color: #0f172a; }
    .cs-ws-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cs-ws-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .cs-engine-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 500;
      color: #64748b;
    }
    .cs-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #cbd5e1;
      display: inline-block;
    }
    .cs-dot.ok { background: #22c55e; }
    .cs-dot.warn { background: #94a3b8; }
    .cs-dot.off { background: #ef4444; }

    .cs-banner {
      padding: 8px 18px;
      font-size: 12px;
      font-weight: 500;
      border-bottom: 1px solid var(--border);
    }
    .cs-banner.ok { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
    .cs-banner.error { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
    .cs-banner.info { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }

    /* Thread Scroll + Empty State (01_empty_state_greeting.png) */
    .cs-thread-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 24px 12px;
      display: flex;
      flex-direction: column;
    }
    .cs-empty-state {
      flex: 1;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px;
    }
    .cs-empty-logo {
      color: #334155;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cs-empty-emblem {
      width: 72px;
      height: auto;
      opacity: .24;
      filter: grayscale(100%) contrast(1.05);
      pointer-events: none;
      user-select: none;
      display: block;
    }
    .cs-empty-title {
      margin: 0;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #0f172a;
    }
    .cs-empty-sub {
      margin: 8px 0 0;
      font-size: 13.5px;
      color: #64748b;
      max-width: 440px;
      line-height: 1.5;
    }

    .cs-thread-inner {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .cs-handover-tag {
      align-self: center;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #334155;
      font-size: 11.5px;
      font-weight: 500;
    }
    .cs-msg { display: flex; width: 100%; }
    .cs-msg-user { justify-content: flex-end; }
    .cs-user-bubble {
      max-width: 76%;
      background: #f1f5f9;
      color: #0f172a;
      border-radius: 18px;
      padding: 10px 16px;
      font-size: 14px;
      line-height: 1.55;
      border: 1px solid #e2e8f0;
    }
    .cs-msg-bot {
      align-items: flex-start;
      gap: 12px;
    }
    .cs-bot-monogram {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #eff6ff;
      border: 1px solid #dbeafe;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .cs-bot-content {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      line-height: 1.65;
      color: #0f172a;
    }
    .cs-bot-text { word-break: break-word; }
    .cs-inline-code {
      background: #f1f5f9;
      color: #0f172a;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 12.5px;
      font-family: Consolas, ui-monospace, monospace;
    }
    .cs-msg-actions {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }
    .cs-msg-time {
      font-size: 11.5px;
      color: #94a3b8;
      margin-right: 4px;
      user-select: none;
    }
    .cs-msg-act-btn {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .12s ease, color .12s ease;
    }
    .cs-msg-act-btn:hover { background: #f1f5f9; color: #0f172a; }
    .cs-msg-act-btn.copied { color: #16a34a; background: #f0fdf4; }
    .cs-msg-act-btn.active-up { color: #2563eb; background: #eff6ff; }
    .cs-msg-act-btn.active-down { color: #dc2626; background: #fef2f2; }

    /* Mindik Draft Review Card (Minimalist Modular Card) */
    .cs-review-card {
      margin-top: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(15,23,42,.04);
    }
    .cs-review-card.pill-ok { border-color: #86efac; }
    .cs-review-card.pill-cancel { border-color: #fca5a5; opacity: .9; }
    .cs-review-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      font-size: 12.5px;
    }
    .cs-review-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #0f172a;
    }
    .cs-tag {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 6px;
      background: #e2e8f0;
      color: #334155;
      font-weight: 600;
    }
    .cs-review-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 600;
      background: #f1f5f9;
      color: #475569;
    }
    .cs-review-card.pill-ok .cs-review-badge { background: #dcfce7; color: #166534; }
    .cs-review-card.pill-cancel .cs-review-badge { background: #fee2e2; color: #991b1b; }
    .cs-card-thumb {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      font-size: 11.5px;
      color: #475569;
    }
    .cs-card-thumb img { max-height: 76px; border-radius: 8px; border: 1px solid #cbd5e1; }
    .cs-review-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    .cs-review-table td {
      padding: 7px 14px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: top;
    }
    .cs-review-table td:first-child {
      width: 165px;
      color: #64748b;
      font-weight: 600;
    }
    .cs-st-old {
      background: #e2e8f0;
      color: #334155;
      padding: 2px 8px;
      border-radius: 5px;
      font-weight: 700;
      font-size: 11px;
    }
    .cs-st-new {
      background: #dcfce7;
      color: #166534;
      padding: 2px 8px;
      border-radius: 5px;
      font-weight: 700;
      font-size: 11px;
    }
    .cs-edit-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 12px 14px;
    }
    .cs-edit-grid label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
    }
    .cs-edit-grid input, .cs-edit-grid select {
      padding: 7px 9px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 12.5px;
    }

    /* =====================================================================
       Responsiveness: Tablet (<= 992px) & Smartphone (<= 768px)
       ===================================================================== */
    @media (max-width: 992px) {
      .cas-layout { grid-template-columns: minmax(0, 1fr); }
      .cas-sidebar { display: none; }
      .cas-sandbox-tag { display: none; }

      .cs-icon-btn {
        width: 40px;
        height: 40px;
      }
      .cs-session-actions {
        opacity: 1;
      }
      .cs-history-sidebar {
        position: fixed;
        left: 0;
        top: 52px;
        bottom: 0;
        z-index: 60;
        width: 260px;
        transform: translateX(-100%);
        box-shadow: 0 20px 44px rgba(15, 23, 42, .22);
      }
      .cs-history-sidebar.mobile-open {
        transform: translateX(0);
      }
      .cs-drawer-backdrop.active {
        display: block;
        position: fixed;
        inset: 52px 0 0 0;
        background: rgba(15, 23, 42, .42);
        z-index: 55;
      }
